name: Test BinderPress
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
      - run: npm test
        timeout-minutes: 10
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
      - run: npm run build:public
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
      - run: npm pack --dry-run
      - name: Upload proofs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binderpress-proofs-${{ matrix.os }}
          path: |
            examples/starter/docs/pdfs/
            examples/starter/docs/previews/
            examples/starter/build/diagnostics/
          if-no-files-found: warn
